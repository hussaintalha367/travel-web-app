<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Recommendation App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= HEADER / NAV BAR (6 ELEMENTS) ================= -->
  <header>
    <h1>🌍 Travel Recommendation</h1>
    <p>Find your perfect destination based on your preferences.</p>

    <nav class="main-nav">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="about.html" class="nav-link">About Us</a>
      <a href="contact.html" class="nav-link">Contact Us</a>

      <input
        type="text"
        id="searchInput"
        class="nav-search"
        placeholder="Search destinations..."
        aria-label="Search destinations"
      />

      <button id="searchBtn" class="nav-btn">Search</button>
      <button id="clearBtn"  class="nav-btn nav-btn-clear">Clear</button>
    </nav>
  </header>

  <main>

    <!-- ================= HOME PAGE ================= -->
    <section id="page-home" class="page active">
      <div class="controls">
        <label>
          Category:
          <select id="category">
            <option value="all">All</option>
            <option value="beach">Beach</option>
            <option value="temple">Temple</option>
            <option value="mountain">Mountain</option>
            <option value="city">City</option>
            <option value="historical">Historical</option>
          </select>
        </label>

        <label>
          Max Budget ($):
          <input type="number" id="budget" value="5000" min="0" step="100" />
        </label>

        <button id="recommendBtn">Recommend</button>
      </div>

      <div id="results" class="results"></div>
    </section>

  </main>

  <footer>
    <p>&copy; 2025 Travel Recommendation App</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
